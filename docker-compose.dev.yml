version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python manage.py runserver 0.0.0.0:8002
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: dev-secret-key
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    restart: unless-stopped
